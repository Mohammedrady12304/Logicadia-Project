<div class="dashboard-container">

  <button class="back-btn" (click)="goBack()">← Back</button>

  <h4 class="page-title">Assign Learning Path</h4>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-light"></div>
  </div>

  <!-- Success -->
  <div *ngIf="successMessage" class="success-box">
    ✅ {{ successMessage }}
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="alert-box">
    {{ errorMessage }}
  </div>

  <!-- Form -->
  <div class="form-card" *ngIf="!isLoading">

    <div class="field-group">
      <label class="field-label">Age</label>
      <input
        type="number"
        class="field-input"
        placeholder="Enter age"
        [(ngModel)]="dto.age"
        name="age"
        min="1"
        max="18">
    </div>

    <div class="field-group">
      <label class="field-label">Interests</label>
      <input
        type="text"
        class="field-input"
        placeholder="e.g. drawing, football, space"
        [(ngModel)]="dto.interests"
        name="interests"
        maxlength="250">
    </div>

    <div class="field-group">
      <label class="field-label">Favorite Color</label>
      <input
        type="text"
        class="field-input"
        placeholder="Enter favorite color"
        [(ngModel)]="dto.favoriteColor"
        name="favoriteColor"
        maxlength="50">
    </div>

    <div class="field-group">
      <label class="field-label">Favorite Animal</label>
      <input
        type="text"
        class="field-input"
        placeholder="Enter favorite animal"
        [(ngModel)]="dto.favoriteAnimal"
        name="favoriteAnimal"
        maxlength="50">
    </div>

    <div class="field-group">
      <label class="field-label">Learning Topic</label>
      <input
        type="text"
        class="field-input"
        placeholder="Enter learning topic"
        [(ngModel)]="dto.learningTopic"
        name="learningTopic"
        maxlength="100">
    </div>

    <div class="field-group">
      <label class="field-label">Reading Level</label>
      <select class="field-select" [(ngModel)]="dto.readingLevel" name="readingLevel">
        <option value="" disabled>Choose reading level...</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">Preferred Language</label>
      <select class="field-select" [(ngModel)]="dto.preferredLanguage" name="preferredLanguage">
        <option value="" disabled>Choose language...</option>
        <option value="Arabic">Arabic</option>
        <option value="English">English</option>
      </select>
    </div>

    <button class="btn-submit" (click)="submit()" [disabled]="isSubmitting">
      <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
      {{ isSubmitting ? 'Assigning...' : 'Assign Path' }}
    </button>

  </div>
</div>
