<!-- Loading -->
<div *ngIf="isLoading" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>

<!-- Error -->
<div *ngIf="errorMessage" class="alert alert-danger">
  {{ errorMessage }}
  <button class="btn btn-link" (click)="goBack()">Go back</button>
</div>

<!-- Story Content -->
<div *ngIf="story && !isLoading" class="d-flex flex-column align-items-center text-center py-5">

  <button class="btn btn-link text-decoration-none align-self-start mb-3" (click)="goBack()">
    <i class="bi bi-arrow-left"></i> Back
  </button>

  <div class="card shadow-sm p-4" style="max-width: 600px;">
    <h4 class="fw-bold mb-3">{{ story.title }}</h4>
    <p class="text-muted" style="line-height: 1.8;">{{ story.narrativeText }}</p>

    <button class="btn btn-primary mt-3" (click)="startStory()">
      {{ story.isCompleted ? 'Replay' : 'Start' }}
      <i class="bi bi-arrow-right ms-1"></i>
    </button>
  </div>

</div>
