<div class="scenario-page">

<div *ngIf="isLoading" class="loading">
<div class="spinner-border text-light"></div>
</div>

<div *ngIf="errorMessage" class="error-box">
{{errorMessage}}
</div>

<div *ngIf="scenario && !isLoading" class="scenario-wrapper">

<div class="scenario-card">

<div class="scenario-icon">🎮</div>

<h1>{{scenario.title}}</h1>

<p class="description">
{{scenario.description}}
</p>

<div class="choices" *ngIf="!result">

<button
*ngFor="let choice of scenario.choices"
class="choice-btn"
[class.selected]="selectedChoiceId===choice.id"
(click)="selectChoice(choice)">

✨ {{choice.choiceText}}

</button>

</div>

<button
*ngIf="!result"
class="submit-btn"
[disabled]="!selectedChoiceId || isSubmitting"
(click)="submitChoice()">

<span *ngIf="isSubmitting"
class="spinner-border spinner-border-sm">
</span>

Submit Answer

</button>

<div *ngIf="result" class="result-box">

<div class="result-icon">
{{result.isCorrect?'🎉':'❌'}}
</div>

<h2>
{{result.isCorrect?'Correct!':'Incorrect'}}
</h2>

<p *ngIf="result.feedback">
{{result.feedback}}
</p>

<div class="xp">
⭐ +{{result.xpEarned}} XP
</div>

<button class="continue-btn" (click)="continueNext()">
Continue →
</button>

</div>

</div>

</div>

</div>
