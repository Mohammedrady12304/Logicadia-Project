<div class="level-page">

<div *ngIf="isLoading" class="loading-state">
  <div class="spinner-border text-light"></div>
</div>

<div *ngIf="errorMessage" class="error-box">
  {{errorMessage}}
  <button (click)="goBack()">Go Back</button>
</div>

<div *ngIf="level && !isLoading" class="content">

<button class="back-btn" (click)="goBack()">
← Back to Levels
</button>

<div class="level-header">

<div class="level-icon">⭐</div>

<div>
<h1>{{level.title}}</h1>
<p>{{level.description}}</p>
</div>

<div class="xp">
{{level.xpReward}} XP
</div>

</div>

<h2>Stories</h2>

<div class="stories-container">

<button *ngFor="let story of level.stories"
class="story-card"
(click)="openStory(story)">

<div class="story-number">
{{story.orderIndex}}
</div>

<div class="story-info">
<h3>{{story.title}}</h3>
<p>{{story.narrativeText}}</p>
</div>

<span class="status"
[class.done]="story.isCompleted"
[class.pending]="!story.isCompleted">

{{story.isCompleted ? 'Completed' : 'Not Started'}}

</span>

</button>

<div *ngIf="level.stories.length === 0" class="empty">
No stories available yet.
</div>

</div>

</div>

</div>
