<div class="path-container">

  <!-- Header -->
  <div class="header">
    <div class="logo">LOGICADIA</div>
    <div class="header-right">
      <div class="avatar">🙂</div>
      <div class="xp-badge">{{ totalXp }} XP</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-row">
    <span class="progress-label">{{ progressPercent }}%</span>
    <div class="progress-track">
      <div class="progress-fill" [style.width.%]="progressPercent"></div>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner-border text-light"></div>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <!-- Path -->
  <svg *ngIf="!isLoading && !errorMessage" width="100%" viewBox="0 0 600 280" class="path-svg">
    <path d="M40 60 Q160 60 160 130 Q160 200 280 200 Q400 200 400 130 Q400 60 520 60"
          fill="none" stroke="#5a52c9" stroke-width="22" stroke-linecap="round"/>
    <path d="M40 60 Q160 60 160 130 Q160 200 280 200 Q400 200 400 130 Q400 60 520 60"
          fill="none" stroke="#8a82f0" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" opacity="0.6"/>

    <g *ngFor="let level of levels; let i = index" (click)="openLevel(level)" [style.cursor]="level.isUnlocked ? 'pointer' : 'not-allowed'">

      <ng-container [ngSwitch]="getStatus(level, i)">

        <!-- Completed -->
        <g *ngSwitchCase="'completed'">
          <circle [attr.cx]="getNodePosition(i).x" [attr.cy]="getNodePosition(i).y" r="20" fill="#3ecf8e"/>
          <path [attr.transform]="'translate(' + (getNodePosition(i).x - 8) + ',' + (getNodePosition(i).y - 7) + ')'"
                d="M0 6l5 6 11-13" fill="none" stroke="#0c3d28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Active -->
        <g *ngSwitchCase="'active'">
          <circle [attr.cx]="getNodePosition(i).x" [attr.cy]="getNodePosition(i).y" r="26" fill="#f5d76e" opacity="0.3"/>
          <circle [attr.cx]="getNodePosition(i).x" [attr.cy]="getNodePosition(i).y" r="20" fill="#f5a623"/>
          <text [attr.x]="getNodePosition(i).x" [attr.y]="getNodePosition(i).y + 6" text-anchor="middle" font-size="18">★</text>
        </g>

        <!-- Locked -->
        <g *ngSwitchCase="'locked'">
          <circle [attr.cx]="getNodePosition(i).x" [attr.cy]="getNodePosition(i).y" r="20" fill="#3a3680"/>
          <path [attr.transform]="'translate(' + (getNodePosition(i).x - 8) + ',' + (getNodePosition(i).y - 6) + ')'"
                d="M0 0h16v12h-16z M4 0v-5a4 4 0 018 0v5" fill="none" stroke="#9b96d8" stroke-width="2"/>
        </g>

      </ng-container>

      <text [attr.x]="getNodePosition(i).x"
            [attr.y]="getNodePosition(i).y + (getStatus(level, i) === 'active' ? 40 : 36)"
            text-anchor="middle"
            [attr.fill]="getStatus(level, i) === 'locked' ? '#9b96d8' : '#ffffff'"
            font-size="13" font-weight="500">
        {{ level.title }}
      </text>

      <text *ngIf="getStatus(level, i) === 'active'"
            [attr.x]="getNodePosition(i).x" [attr.y]="getNodePosition(i).y + 56"
            text-anchor="middle" fill="#f5a623" font-size="11" font-weight="500">
        ACTIVE
      </text>

    </g>
  </svg>

  <!-- Continue button -->
  <div class="continue-row" *ngIf="!isLoading && !errorMessage">
    <button class="continue-btn">Continue</button>
    <p class="encourage-text">You are doing amazing! Keep going!</p>
  </div>

</div>
