<div class="register-page">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="register-card">
    <div class="logo">LOGICADIA</div>
    <h2>Start Your Adventure!</h2>
    <p class="subtitle">Create a parent account to guide your little explorer</p>

    <div class="success-box" *ngIf="successMessage">
      <span class="icon">✨</span> {{ successMessage }}
    </div>

    <div class="error-box" *ngIf="errorMessage">
      <span class="icon">⚠️</span> {{ errorMessage }}
    </div>

    <form (ngSubmit)="onRegister()">
      
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <div class="input-wrapper">
          <input
            type="text"
            class="field-input"
            placeholder="Enter your full name"
            [(ngModel)]="registerModel.fullName"
            name="fullName"
            required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            class="field-input"
            placeholder="you@example.com"
            [(ngModel)]="registerModel.email"
            name="email"
            required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Phone Number</label>
        <div class="input-wrapper">
          <input
            type="tel"
            class="field-input"
            placeholder="01xxxxxxxxx"
            [(ngModel)]="registerModel.phoneNumber"
            name="phoneNumber"
            required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            class="field-input"
            placeholder="••••••••"
            [(ngModel)]="registerModel.password"
            name="password"
            required>
        </div>
      </div>

      <button type="submit" class="register-btn" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
        {{ isLoading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <p class="footer-text">
      Already an explorer? <a routerLink="/login">Sign In Instead</a>
    </p>
  </div>
</div>
