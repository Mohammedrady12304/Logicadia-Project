<div class="register-child-page">

  <div class="bubble b1">⭐</div>
  <div class="bubble b2">🚀</div>
  <div class="bubble b3">🧸</div>

  <div class="register-card">

    <div class="card-icon">
      🧒
    </div>

    <h1>
      Register Your Child
    </h1>

    <p class="subtitle">
      Create your little explorer's account and begin the learning adventure.
    </p>

    <form
      #childForm="ngForm"
      (ngSubmit)="registerChild()"
      novalidate>

      <div class="field">

        <label>Username</label>

        <input
          type="text"
          [(ngModel)]="model.username"
          name="username"
          placeholder="Choose a username"
          required>

      </div>

      <div class="field">

        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="model.password"
          name="password"
          placeholder="Create a password"
          required>

      </div>

      <div class="field">

        <label>Child Name</label>

        <input
          type="text"
          [(ngModel)]="model.name"
          name="name"
          placeholder="Enter child's name"
          required>

      </div>

      <div class="field">

        <label>Age</label>

        <input
          type="number"
          [(ngModel)]="model.age"
          name="age"
          placeholder="Age"
          required>

      </div>

      <button
        type="submit"
        class="register-btn">

        🚀 Register Child

      </button>

    </form>

    <div
      class="success-box"
      *ngIf="successMessage">

      <div class="message-icon">
        🎉
      </div>

      <div class="message-text">
        {{ successMessage }}
      </div>

    </div>

    <div
      class="error-box"
      *ngIf="errorMessage">

      <div class="message-icon">
        ⚠️
      </div>

      <div class="message-text">
        {{ errorMessage }}
      </div>

    </div>

  </div>

</div>
